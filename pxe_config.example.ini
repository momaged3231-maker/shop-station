[server]
# كرت شبكة النشر المعزول - مش كرت النت الحالي (10.0.0.39)
# بعد تركيب كرت USB-Ethernet التاني او عزل السويتش، اظبطه على:
server_ip = 192.168.10.1
subnet_mask = 255.255.255.0

[dhcp]
# نطاق التوزيع لاجهزة العملاء فقط
pool_start = 192.168.10.100
pool_end = 192.168.10.200
lease_seconds = 3600
# ملفات الاقلاع حسب نوع الجهاز (option 93)
bootfile_bios = undionly.kpxe
bootfile_uefi64 = ipxe.efi
bootfile_uefi32 = ipxe.efi

[tftp]
bind_port = 69
root = D:\Station\netboot
# TFTP للملفات الصغيرة فقط (iPXE) - الملفات الكبيرة عبر HTTP/SMB

[http]
bind_port = 8080
root = D:\Station\netboot

[smb]
share_name = Station
path_ISO = D:\Station\ISO
path_Apps = D:\Station\Apps
path_Drivers = D:\Station\Drivers
