[server]
# Single-NIC proxy mode: this PC keeps its shop-LAN address.
# Make it STATIC (or a DHCP reservation for MAC 18-60-24-B1-1C-A0) so clients can always reach it.
server_ip = 10.0.0.39
subnet_mask = 255.255.255.0

[dhcp]
# mode = proxy (share LAN with router) | full (isolated switch only!)
mode = proxy
proxy_port = 4011
# ملفات الاقلاع حسب نوع الجهاز (option 93)
bootfile_bios = ipxe/undionly.kpxe
bootfile_uefi64 = ipxe/ipxe.efi
bootfile_uefi32 = ipxe/ipxe.efi

[tftp]
bind_port = 69
root = D:\Station\netboot
# TFTP للملفات الصغيرة فقط (iPXE) - الملفات الكبيرة عبر HTTP/SMB

[http]
bind_port = 8080
root = D:\Station\netboot

[smb]
share_name = Station
path_ISO = D:\Station\ISO
path_Apps = D:\Station\Apps
path_Drivers = D:\Station\Drivers
